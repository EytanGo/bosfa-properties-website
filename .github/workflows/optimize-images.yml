name: Optimize Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get install -y imagemagick
      
      - name: Compress large images
        run: |
          cd public/images
          for file in *.jpg *.jpeg *.png; do
            [ -f "$file" ] || continue
            size=$(stat -c%s "$file")
            if [ "$size" -gt 256000 ]; then
              echo "Compressing $file ($(( size / 1024 ))KB)..."
              if [[ "$file" == *.png ]]; then
                convert "$file" -strip -quality 85 "$file"
              else
                convert "$file" -strip -quality 82 -resize "1920x1920>" "$file"
              fi
              newsize=$(stat -c%s "$file")
              echo "  -> $(( newsize / 1024 ))KB (saved $(( (size - newsize) / 1024 ))KB)"
            fi
          done
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/
          git diff --staged --quiet || git commit -m "Optimize images: compress files over 250KB"
          git push
